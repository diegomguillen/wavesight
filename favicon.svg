<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Scope Screen Bezel -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#22334d" stroke-width="2.5"/>
  <!-- Reticle Grid -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1c2b42" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="#1c2b42" stroke-width="1.2" stroke-dasharray="2 3"/>
  <rect x="10" y="10" width="44" height="44" rx="4" fill="none" stroke="#152033" stroke-width="1"/>
  <!-- Waveform Trace with glow -->
  <path d="M 8 32 C 16 32, 19 14, 25 14 C 31 14, 33 50, 39 50 C 45 50, 48 32, 56 32" 
        fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Indicator dots -->
  <circle cx="25" cy="14" r="2.2" fill="#ffd600"/>
  <circle cx="39" cy="50" r="2.2" fill="#00e676"/>
</svg>
